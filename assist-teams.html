<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Assist — Team Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--bg2:#f0ebe2;--sf:#fff;--sf2:#f5f2ed;--sf3:#f9f7f3;--tx:#3a342d;--tx2:#6e655a;--tx3:#9b9589;--bd:#e5e0d8;--bd2:#eae5dc;--red:#C0392B;--blue:#2E86C1;--orange:#D4850E;--green:#27AE60;--f:'DM Sans',sans-serif;--sr:'Fraunces',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:linear-gradient(178deg,var(--bg),var(--bg2));color:var(--tx);min-height:100vh}
button{cursor:pointer;font-family:var(--f);border:none;background:none}
input,textarea{font-family:var(--f);color:var(--tx);outline:none}
input:focus,textarea:focus{border-color:var(--blue)!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:8px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}50%{box-shadow:0 0 0 4px rgba(192,57,43,.15)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#app{max-width:700px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px;text-align:center}
.login-card{background:var(--sf);border-radius:16px;padding:32px 28px;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-title{font-family:var(--sr);font-size:28px;font-weight:700;margin:12px 0 4px}
.login-sub{font-size:13px;color:var(--tx3);margin-bottom:24px;line-height:1.5}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;font-size:14px;font-weight:600;color:var(--tx);background:var(--sf);transition:all .15s}
.ms-btn:hover{background:var(--sf2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.login-error{font-size:12px;color:var(--red);margin-top:14px;padding:8px 12px;background:rgba(192,57,43,.06);border-radius:8px}
.login-note{font-size:11px;color:var(--tx3);margin-top:16px}

.sync-bar{display:flex;align-items:center;gap:5px;padding:4px 16px;font-size:10px;color:var(--tx3)}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sync-dot.online{background:var(--green)}.sync-dot.offline{background:var(--red)}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;border-bottom:1px solid var(--bd2);background:var(--bg);position:sticky;top:0;z-index:50}
.logo{font-size:17px;font-weight:700}.logo span{font-family:var(--sr)}
.nav{display:flex;gap:2px;align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;border-radius:7px;color:var(--tx3);font-size:10px;transition:all .15s}
.nav-btn:hover{background:var(--sf2)}.nav-btn.active{background:var(--tx);color:var(--bg)}
.user-pill{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:16px;font-size:10px;color:var(--tx2);background:var(--sf2);margin-left:4px}
.user-pill img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.signout-btn{font-size:10px;color:var(--tx3);text-decoration:underline;padding:2px 6px}

.alert-bar{display:flex;gap:5px;padding:7px 16px;flex-wrap:wrap}
.alert{font-size:10px;font-weight:600;padding:3px 9px;border-radius:14px}
.alert-red{background:rgba(192,57,43,.08);color:var(--red)}
.alert-orange{background:rgba(212,133,14,.1);color:var(--orange);animation:glow 2s infinite}
.alert-blue{background:rgba(46,134,193,.08);color:var(--blue)}

.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:7px}
.welcome-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 12px 16px}
.welcome-title{font-family:var(--sr);font-size:22px;font-weight:700;margin-top:4px}
.welcome-sub{font-size:12.5px;color:var(--tx3);max-width:380px;line-height:1.55;margin-top:6px}
.prompt-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;max-width:440px}
.prompt-chip{padding:7px 12px;border:1px solid var(--bd);border-radius:18px;background:var(--sf);font-size:11.5px;color:var(--tx2);transition:all .15s}
.prompt-chip:hover{background:var(--sf2)}
.msg-row{display:flex;gap:6px;align-items:flex-end;animation:fadein .25s ease}
.msg-row.user{justify-content:flex-end}.msg-row.bot{justify-content:flex-start}
.bot-av{width:24px;height:24px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.msg-u{max-width:76%;padding:8px 12px;border-radius:13px 13px 3px 13px;background:var(--tx);color:#f5f2ed;font-size:12.5px;white-space:pre-wrap;line-height:1.55}
.msg-b{max-width:76%;padding:8px 12px;border-radius:13px 13px 13px 3px;background:var(--sf);font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.04);white-space:pre-wrap;line-height:1.55}
.dots{display:flex;gap:3px}.dot{width:5px;height:5px;border-radius:50%;background:#c5bdb3;animation:dotB .8s ease infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.input-bar{display:flex;gap:7px;padding:8px 16px 16px;border-top:1px solid var(--bd2);background:var(--bg)}
.chat-input{flex:1;padding:10px 14px;border:1px solid var(--bd);border-radius:20px;font-size:12.5px;background:var(--sf)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.send-btn:disabled{opacity:.3}

.view-wrap{flex:1;overflow-y:auto;padding:12px 16px 70px}
.view-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.view-title{font-family:var(--sr);font-size:18px;font-weight:700}
.view-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.add-btn{display:flex;align-items:center;gap:3px;padding:7px 12px;border-radius:7px;background:var(--tx);color:var(--bg);font-size:11px;font-weight:600}
.scope-tabs{display:flex;gap:3px;margin-bottom:14px}
.scope-tab{padding:4px 11px;border:1px solid var(--bd);border-radius:14px;font-size:11px;color:var(--tx3);font-weight:500;transition:all .15s}
.scope-tab.active{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.quad-label{display:flex;align-items:center;gap:4px;font-size:12px;margin:3px 0 5px}
.task-card{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;background:var(--sf);border-radius:8px;margin-bottom:4px;border-left:3px solid #ccc;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .15s}
.task-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.06)}.task-card.completed{opacity:.4}.task-card.due-soon{animation:glow 2s infinite}
.checkbox{width:17px;height:17px;min-width:17px;border-radius:4px;border:2px solid #c5bdb3;display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px}
.del-btn{color:#d6cfc5;font-size:15px;padding:0 2px;line-height:1}.del-btn:hover{color:var(--red)}
.avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--f);flex-shrink:0}
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.matrix-cell{border:1px solid var(--bd);border-radius:9px;padding:10px;min-height:90px}
.matrix-item{display:flex;align-items:center;gap:4px;padding:5px 7px;background:var(--sf);border-radius:5px;margin-bottom:2px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03);font-size:10px}
.matrix-item:hover{box-shadow:0 2px 5px rgba(0,0,0,.07)}
.backdrop{position:fixed;inset:0;background:rgba(58,52,45,.35);z-index:90;backdrop-filter:blur(2px)}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;background:var(--sf);border-radius:16px 16px 0 0;padding:20px 18px 26px;z-index:100;box-shadow:0 -6px 28px rgba(0,0,0,.13);max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
.form-input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;font-size:12.5px;margin-bottom:10px;background:var(--bg)}
textarea.form-input{min-height:44px;resize:vertical}
.form-label{display:block;font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.quad-opt{display:flex;align-items:center;gap:5px;padding:8px 9px;border:1.5px solid var(--bd);border-radius:7px;font-size:10px;font-weight:600;color:var(--tx2)}
.cat-row,.assign-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cat-opt,.scope-opt{padding:4px 10px;border:1.5px solid var(--bd);border-radius:6px;font-size:10.5px;font-weight:500}
.cat-opt.sel,.scope-opt.sel{border-color:var(--blue);background:rgba(46,134,193,.06)}
.scope-row{display:flex;gap:6px;margin-bottom:12px}.scope-opt{flex:1;text-align:center;font-size:11px}
.assign-opt{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 3px;border:1.5px solid var(--bd);border-radius:18px;font-size:11px}
.assign-opt.sel{background:rgba(46,134,193,.06)}
.date-row{display:flex;gap:8px;margin-bottom:12px}.date-row input{flex:1}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer}
.toggle{width:38px;height:20px;border-radius:10px;position:relative;transition:background .2s}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.form-actions{display:flex;gap:8px}
.cancel-btn{flex:1;padding:10px;border:1px solid var(--bd);border-radius:7px;color:var(--tx3);font-size:12.5px;font-weight:600}
.submit-btn{flex:2;padding:10px;border-radius:7px;background:var(--tx);color:var(--bg);font-size:12.5px;font-weight:600}.submit-btn:disabled{opacity:.35}
.assignee-chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;background:var(--sf2);border-radius:20px;font-size:11px;font-weight:500}
.detail-actions{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.detail-action{padding:6px 12px;border:1px solid var(--bd);border-radius:7px;font-size:11px;color:var(--tx2)}.detail-action:hover{background:var(--sf2)}.detail-action.danger{color:var(--red)}
.comment-card{padding:8px 10px;background:var(--sf3);border-radius:7px;margin-bottom:5px}
.member-row{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--sf3);border-radius:8px;margin-bottom:6px}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center}
@media(max-width:500px){.matrix-grid{gap:5px}.matrix-cell{padding:8px;min-height:70px}.nav-btn{padding:4px 7px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
// ═══ CONFIG ═══
firebase.initializeApp({
  apiKey:"AIzaSyCrXugHg_SNSkfVmmyhYtFJ0oiZLdZiucc",
  authDomain:"tasks---pa.firebaseapp.com",
  databaseURL:"https://tasks---pa-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"tasks---pa",
  storageBucket:"tasks---pa.firebasestorage.app",
  messagingSenderId:"982342404744",
  appId:"1:982342404744:web:ce7a55cc852cf80279ad3d"
});
const db=firebase.database(),auth=firebase.auth();

// ═══ CONSTANTS ═══
const QDS=[
  {id:"do",label:"Do First",sub:"Urgent & Important",color:"#C0392B",bg:"rgba(192,57,43,.06)",icon:"🔥"},
  {id:"schedule",label:"Schedule",sub:"Important, Not Urgent",color:"#2E86C1",bg:"rgba(46,134,193,.06)",icon:"📅"},
  {id:"delegate",label:"Delegate",sub:"Urgent, Not Important",color:"#D4850E",bg:"rgba(212,133,14,.06)",icon:"👋"},
  {id:"eliminate",label:"Later",sub:"Neither",color:"#8E8E8E",bg:"rgba(142,142,142,.06)",icon:"📦"},
];
const CATS=[
  {id:"project",label:"Project",e:"📊"},{id:"meeting",label:"Meeting",e:"🤝"},
  {id:"deadline",label:"Deadline",e:"⏰"},{id:"review",label:"Review",e:"🔍"},
  {id:"planning",label:"Planning",e:"🗓"},{id:"admin",label:"Admin",e:"📎"},
  {id:"personal",label:"Personal",e:"🏠"},
];
const ACOL=["#C0392B","#2E86C1","#27AE60","#8E44AD","#D4850E","#16A085","#E74C3C","#2980B9","#1ABC9C","#E67E22"];

// ═══ STATE ═══
let user=null;
let S={phase:"login",syncStatus:"connecting",tasks:[],members:[],messages:[],view:"chat",taskScope:"all",sending:false,selectedTask:null,showTaskForm:false,editTask:null,showTeam:false,fT:"",fD:"",fCat:"project",fQ:"do",fDt:"",fTm:"",fRem:false,fSc:"shared",fAs:[],newName:"",newRole:"",commentInput:"",input:"",loginError:""};

// ═══ UTILS ═══
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().split("T")[0];
const nowT=()=>{const d=new Date();return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function fmtDT(d,t){if(!d)return"";const x=new Date(d+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);const df=Math.round((x-n)/864e5);let s=df===0?"Today":df===1?"Tomorrow":df===-1?"Yesterday":df<-1?`${Math.abs(df)}d overdue`:df<=7?`In ${df}d`:x.toLocaleDateString("en-US",{month:"short",day:"numeric"});if(t){const[h,m]=t.split(":").map(Number);s+=` at ${h%12||12}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`}return s}
const isOD=(d,t)=>d?new Date(d+"T"+(t||"23:59")+":00")<new Date():false;
const isDueSoon=(d,t)=>{if(!d)return false;const df=new Date(d+"T"+(t||"23:59")+":00")-new Date();return df>0&&df<3600000};
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"};
const ini=n=>(n||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
const acol=n=>{let h=0;for(let i=0;i<(n||"").length;i++)h=n.charCodeAt(i)+((h<<5)-h);return ACOL[Math.abs(h)%ACOL.length]};
const timeAgo=iso=>{const s=Math.floor((Date.now()-new Date(iso))/1000);return s<60?"just now":s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:`${Math.floor(s/86400)}d ago`};
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const av=(name,sz=24)=>`<div class="avatar" style="width:${sz}px;height:${sz}px;min-width:${sz}px;font-size:${sz*.38}px;background:${acol(name)}">${ini(name)}</div>`;
const pav=(url,sz=24)=>url?`<img src="${url}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover">`:"";

// ═══ AUTH ═══
auth.onAuthStateChanged(u=>{
  if(u){
    user=u;S.loginError="";
    const ref=db.ref("members/"+u.uid);
    ref.once("value").then(s=>{
      if(!s.val())ref.set({id:u.uid,name:u.displayName||u.email.split("@")[0],email:u.email||"",photo:u.photoURL||"",role:"Team Member"});
      else ref.update({name:u.displayName||s.val().name,email:u.email||"",photo:u.photoURL||""});
    });
    db.ref("presence/"+u.uid).onDisconnect().remove();
    db.ref("presence/"+u.uid).set({name:u.displayName,t:firebase.database.ServerValue.TIMESTAMP});
    db.ref("tasks").on("value",s=>{S.tasks=s.val()?Object.values(s.val()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)):[];render()});
    db.ref("members").on("value",s=>{S.members=s.val()?Object.values(s.val()):[];render()});
    db.ref(".info/connected").on("value",s=>{S.syncStatus=s.val()?"online":"offline";render()});
    try{const m=localStorage.getItem("wa-msg-"+u.uid);if(m)S.messages=JSON.parse(m)}catch{}
    S.phase="app";render();
  }else{user=null;S.phase="login";render()}
});

function signIn(){
  const p=new firebase.auth.OAuthProvider("microsoft.com");
  p.setCustomParameters({tenant:"42173647-0969-460f-9d93-259516988351"});
  auth.signInWithPopup(p).catch(e=>{S.loginError="Sign-in failed: "+e.message;render()});
}
function signOut(){auth.signOut();S.messages=[];S.phase="login";render()}

// ═══ DB ═══
const fbS=t=>{if(db)db.ref("tasks/"+t.id).set(t)};
const fbD=id=>{if(db)db.ref("tasks/"+id).remove()};
const fbM=m=>{if(db)db.ref("members/"+m.id).set(m)};
const fbRM=id=>{if(db)db.ref("members/"+id).remove()};

// ═══ AI ═══
async function askAI(msgs){
  const ml=S.members.map(m=>`${m.name} (${m.role})`).join(", ");
  const ts=S.tasks.filter(t=>!t.completed).slice(0,25).map(t=>{
    const a=t.assignees?.map(id=>S.members.find(m=>m.id===id)?.name||"?").join(",")||"unassigned";
    return`- "${t.title}" [${t.quadrant}][${t.category}][${t.scope}] by:${a}${t.dueDate?` due:${t.dueDate}`:""}${t.dueTime?` ${t.dueTime}`:""}`;
  }).join("\n");
  const sys=`You are a concise work productivity assistant for ${user?.displayName}. Eisenhower matrix, team collab.
TEAM: ${ml||"No members"} | TASKS:\n${ts}\nTODAY: ${today()} ${nowT()}
RULES: Work default. "shared" scope default. Classify quadrant. Assign by name. SHORT (2-4 sentences). Times: EOD=17:00,morning=09:00,noon=12:00,afternoon=14:00.
ACTION at end:
###TASK_ACTION###
{"action":"add","title":"...","category":"...","quadrant":"...","dueDate":"YYYY-MM-DD|null","dueTime":"HH:MM|null","scope":"shared|personal","assignees":["name"],"reminder":true/false}
###END_ACTION###
Updates: {"action":"update","taskId":"...","quadrant":"...","assignees":["name"],"dueDate":"...","dueTime":"..."}`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:msgs.slice(-20).map(m=>({role:m.role,content:m.content}))})});
    const d=await r.json();return d.content?.map(b=>b.text||"").join("")||"Something went wrong.";
  }catch{return"Connection issue. Try again."}
}
function parseAct(t){const m=t.match(/###TASK_ACTION###\s*([\s\S]*?)\s*###END_ACTION###/);if(!m)return null;try{return JSON.parse(m[1].trim())}catch{return null}}
function stripAct(t){return t.replace(/###TASK_ACTION###[\s\S]*?###END_ACTION###/,"").trim()}

// ═══ ACTIONS ═══
async function sendMsg(){
  if(!S.input.trim()||S.sending)return;
  S.messages.push({role:"user",content:S.input.trim()});S.input="";S.sending=true;render();scrollC();
  const reply=await askAI(S.messages);const act=parseAct(reply),clean=stripAct(reply);
  if(act){
    if(act.action==="add"){
      const ra=(act.assignees||[]).map(n=>{const f=S.members.find(m=>m.name.toLowerCase()===n.toLowerCase());return f?.id}).filter(Boolean);
      fbS({id:uid(),title:act.title||"Untitled",description:"",category:act.category||"project",quadrant:act.quadrant||"do",dueDate:act.dueDate||"",dueTime:act.dueTime||"",scope:act.scope||"shared",assignees:ra.length?ra:[user.uid],reminder:act.reminder===true,completed:false,createdAt:new Date().toISOString(),comments:[]});
    }else if(act.action==="update"&&act.taskId){
      const t=S.tasks.find(x=>x.id===act.taskId);if(t){
        const ra=act.assignees?act.assignees.map(n=>{const f=S.members.find(m=>m.name.toLowerCase()===n.toLowerCase());return f?.id}).filter(Boolean):undefined;
        fbS({...t,...(act.quadrant?{quadrant:act.quadrant}:{}),...(ra?{assignees:ra}:{}),...(act.dueDate?{dueDate:act.dueDate}:{}),...(act.dueTime?{dueTime:act.dueTime}:{})});
      }
    }
  }
  S.messages.push({role:"assistant",content:clean});S.sending=false;
  if(user)localStorage.setItem("wa-msg-"+user.uid,JSON.stringify(S.messages));
  render();scrollC();
}
function togDone(id){const t=S.tasks.find(x=>x.id===id);if(t){fbS({...t,completed:!t.completed});if(S.selectedTask?.id===id)S.selectedTask={...S.selectedTask,completed:!S.selectedTask.completed};render()}}
function delTask(id){fbD(id);if(S.selectedTask?.id===id)S.selectedTask=null;render()}
function addCmt(){if(!S.commentInput.trim()||!S.selectedTask)return;const c={id:uid(),author:user.displayName||"",authorId:user.uid,text:S.commentInput.trim(),createdAt:new Date().toISOString()};const up={...S.selectedTask,comments:[...(S.selectedTask.comments||[]),c]};fbS(up);S.selectedTask=up;S.commentInput="";render()}
function subForm(){if(!S.fT.trim())return;const t={id:S.editTask?.id||uid(),title:S.fT.trim(),description:S.fD.trim(),category:S.fCat,quadrant:S.fQ,dueDate:S.fDt,dueTime:S.fTm,reminder:S.fRem,scope:S.fSc,assignees:S.fAs,completed:S.editTask?.completed||false,createdAt:S.editTask?.createdAt||new Date().toISOString(),comments:S.editTask?.comments||[]};fbS(t);rstForm();render()}

function openEd(t){S.fT=t.title;S.fD=t.description||"";S.fCat=t.category;S.fQ=t.quadrant;S.fDt=t.dueDate||"";S.fTm=t.dueTime||"";S.fRem=t.reminder||false;S.fSc=t.scope||"shared";S.fAs=t.assignees||[];S.editTask=t;S.showTaskForm=true;S.selectedTask=null;render()}

    <span class="form-label">Category</span><div class="cat-row">${CATS.map(c=>`<button class="cat-opt ${S.fCat===c.id?"sel":""}" data-fc="${c.id}">${c.e} ${c.label}</button>`).join("")}</div>

function rTC(t){const q=QDS.find(x=>x.id===t.quadrant),cat=CATS.find(c=>c.id===t.category),od=isOD(t.dueDate,t.dueTime)&&!t.completed,soon=isDueSoon(t.dueDate,t.dueTime)&&!t.completed;
  return`<div class="task-card ${t.completed?"completed":""} ${soon?"due-soon":""}" style="border-left-color:${q?.color||"#ccc"}"><button class="checkbox" data-tog="${t.id}" style="background:${t.completed?q?.color:"transparent"};border-color:${t.completed?q?.color:"#c5bdb3"};color:#fff">${t.completed?"✓":""}</button><div style="flex:1;cursor:pointer;min-width:0" data-sel="${t.id}"><div style="display:flex;justify-content:space-between;align-items:center;gap:5px"><span style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${t.completed?"text-decoration:line-through":""}">${esc(t.title)}</span><div style="display:flex;gap:3px;align-items:center;flex-shrink:0;font-size:9px">${t.scope==="personal"?"<span>🔒</span>":"<span>👥</span>"}${t.reminder?"<span>🔔</span>":""}${(t.comments||[]).length?`<span>💬${t.comments.length}</span>`:""}<span>${cat?.e||""}</span></div></div><div style="display:flex;align-items:center;gap:6px;margin-top:2px">${t.dueDate?`<span style="font-size:10.5px;color:${od?"var(--red)":soon?"var(--orange)":"var(--tx3)"};font-weight:${od||soon?600:400}">${od?"⚠ ":""}${soon?"🔔 ":""}${fmtDT(t.dueDate,t.dueTime)}</span>`:""}<div style="display:flex;gap:1px;margin-left:auto">${(t.assignees||[]).slice(0,3).map(a=>{const m=S.members.find(x=>x.id===a);return m?m.photo?pav(m.photo,16):av(m.name,16):""}).join("")}</div></div></div><button class="del-btn" data-del="${t.id}">×</button></div>`}

function bindEv(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.selectedTask=null;render()});
  document.getElementById("nav-team")?.addEventListener("click",()=>{S.showTeam=true;render()});
  document.getElementById("signout")?.addEventListener("click",signOut);
  document.getElementById("bk")?.addEventListener("click",closeAll);
  const ci=document.getElementById("ci");if(ci){ci.oninput=e=>{S.input=e.target.value;document.getElementById("sb").disabled=!e.target.value.trim()||S.sending};ci.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey)sendMsg()};ci.focus()}
  document.getElementById("sb")?.addEventListener("click",sendMsg);
  document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{S.input=b.dataset.prompt;render();setTimeout(()=>document.getElementById("ci")?.focus(),50)});
  document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{S.taskScope=b.dataset.scope;render()});
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=e=>{e.stopPropagation();togDone(b.dataset.tog)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();delTask(b.dataset.del)});
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{S.selectedTask=S.tasks.find(t=>t.id===b.dataset.sel);render()});
  document.getElementById("add-t")?.addEventListener("click",()=>{rstForm();S.showTaskForm=true;render()});
  document.getElementById("close-det")?.addEventListener("click",()=>{S.selectedTask=null;render()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.edit);if(t)openEd(t)});
  document.querySelectorAll("[data-togdet]").forEach(b=>b.onclick=()=>togDone(b.dataset.togdet));
  document.querySelectorAll("[data-deldet]").forEach(b=>b.onclick=()=>delTask(b.dataset.deldet));
  const cmi=document.getElementById("cmt-i");if(cmi){cmi.oninput=e=>{S.commentInput=e.target.value;document.getElementById("cmt-s").disabled=!e.target.value.trim()};cmi.onkeydown=e=>{if(e.key==="Enter")addCmt()}}
  document.getElementById("cmt-s")?.addEventListener("click",addCmt);
  document.getElementById("close-team")?.addEventListener("click",()=>{S.showTeam=false;render()});
  const nn=document.getElementById("nn");if(nn){nn.oninput=e=>{S.newName=e.target.value;document.getElementById("add-m").disabled=!e.target.value.trim()};nn.onkeydown=e=>{if(e.key==="Enter")addMem()}}
  document.getElementById("nr")?.addEventListener("input",e=>{S.newRole=e.target.value});
  document.getElementById("nr")?.addEventListener("keydown",e=>{if(e.key==="Enter")addMem()});
  document.getElementById("add-m")?.addEventListener("click",addMem);
  document.querySelectorAll("[data-rmm]").forEach(b=>b.onclick=()=>rmMem(b.dataset.rmm));
  document.getElementById("ft")?.addEventListener("input",e=>{S.fT=e.target.value;document.getElementById("sub-f").disabled=!e.target.value.trim()});
  document.getElementById("fd")?.addEventListener("input",e=>{S.fD=e.target.value});
  document.querySelectorAll("[data-fq]").forEach(b=>b.onclick=()=>{S.fQ=b.dataset.fq;render()});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{S.fCat=b.dataset.fc;render()});
  document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{S.fSc=b.dataset.fs;render()});
  document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{const id=b.dataset.fa;S.fAs=S.fAs.includes(id)?S.fAs.filter(x=>x!==id):[...S.fAs,id];render()});
  document.getElementById("fdt")?.addEventListener("input",e=>{S.fDt=e.target.value});
  document.getElementById("ftm")?.addEventListener("input",e=>{S.fTm=e.target.value});
  document.getElementById("tog-r")?.addEventListener("click",()=>{S.fRem=!S.fRem;render()});
  document.getElementById("can-f")?.addEventListener("click",()=>{rstForm();render()});
  document.getElementById("sub-f")?.addEventListener("click",subForm);
}
render();
setInterval(()=>{if(S.phase==="app")render()},30000);
</script>
</body>
</html>
