<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Assist — Team Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4;--bg2:#f0ebe2;--sf:#fff;--sf2:#f5f2ed;--sf3:#f9f7f3;
  --tx:#3a342d;--tx2:#6e655a;--tx3:#9b9589;--bd:#e5e0d8;--bd2:#eae5dc;
  --red:#C0392B;--blue:#2E86C1;--orange:#D4850E;--green:#27AE60;--purple:#8E44AD;
  --f:'DM Sans',sans-serif;--sr:'Fraunces',serif;
}
[data-theme="dark"]{
  --bg:#1a1815;--bg2:#222019;--sf:#2a2723;--sf2:#33302b;--sf3:#2e2b27;
  --tx:#e8e2d8;--tx2:#b0a899;--tx3:#7a7468;--bd:#3d3a35;--bd2:#343230;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:linear-gradient(178deg,var(--bg),var(--bg2));color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
button{cursor:pointer;font-family:var(--f);border:none;background:none;color:var(--tx)}
input,textarea,select{font-family:var(--f);color:var(--tx);outline:none;background:var(--bg)}
input:focus,textarea:focus{border-color:var(--blue)!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotB{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}50%{box-shadow:0 0 0 4px rgba(192,57,43,.15)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px;text-align:center}
.login-card{background:var(--sf);border-radius:16px;padding:32px 28px;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-title{font-family:var(--sr);font-size:28px;font-weight:700;margin:12px 0 4px}
.login-sub{font-size:13px;color:var(--tx3);margin-bottom:24px;line-height:1.5}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;font-size:14px;font-weight:600;background:var(--sf);transition:all .15s}
.ms-btn:hover{background:var(--sf2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.login-error{font-size:12px;color:var(--red);margin-top:14px;padding:8px 12px;background:rgba(192,57,43,.06);border-radius:8px}
.login-note{font-size:11px;color:var(--tx3);margin-top:16px}

/* Top bar */
.sync-bar{display:flex;align-items:center;gap:5px;padding:4px 16px;font-size:10px;color:var(--tx3)}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sync-dot.online{background:var(--green)}.sync-dot.offline{background:var(--red)}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;border-bottom:1px solid var(--bd2);background:var(--bg);position:sticky;top:0;z-index:50}
.logo{font-size:17px;font-weight:700}.logo span{font-family:var(--sr)}
.nav{display:flex;gap:1px;align-items:center;flex-wrap:wrap}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;border-radius:7px;color:var(--tx3);font-size:9px;transition:all .15s}
.nav-btn:hover{background:var(--sf2)}.nav-btn.active{background:var(--tx);color:var(--bg)}
.user-pill{display:flex;align-items:center;gap:4px;padding:3px 7px 3px 3px;border-radius:16px;font-size:10px;color:var(--tx2);background:var(--sf2);margin-left:3px}
.user-pill img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.signout-btn{font-size:9px;color:var(--tx3);text-decoration:underline;padding:1px 4px}
.theme-btn{font-size:14px;padding:2px 6px;border-radius:6px}
.theme-btn:hover{background:var(--sf2)}

.alert-bar{display:flex;gap:5px;padding:7px 16px;flex-wrap:wrap}
.alert{font-size:10px;font-weight:600;padding:3px 9px;border-radius:14px}
.alert-red{background:rgba(192,57,43,.08);color:var(--red)}
.alert-orange{background:rgba(212,133,14,.1);color:var(--orange);animation:glow 2s infinite}
.alert-blue{background:rgba(46,134,193,.08);color:var(--blue)}

/* Chat */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:7px}
.welcome-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 12px 16px}
.welcome-title{font-family:var(--sr);font-size:22px;font-weight:700;margin-top:4px}
.welcome-sub{font-size:12.5px;color:var(--tx3);max-width:380px;line-height:1.55;margin-top:6px}
.prompt-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;max-width:440px}
.prompt-chip{padding:7px 12px;border:1px solid var(--bd);border-radius:18px;background:var(--sf);font-size:11px;color:var(--tx2);transition:all .15s}
.prompt-chip:hover{background:var(--sf2)}
.msg-row{display:flex;gap:6px;align-items:flex-end;animation:fadein .25s ease}
.msg-row.user{justify-content:flex-end}.msg-row.bot{justify-content:flex-start}
.bot-av{width:24px;height:24px;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.msg-u{max-width:76%;padding:8px 12px;border-radius:13px 13px 3px 13px;background:var(--tx);color:var(--bg);font-size:12.5px;white-space:pre-wrap;line-height:1.55}
.msg-b{max-width:76%;padding:8px 12px;border-radius:13px 13px 13px 3px;background:var(--sf);font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.04);white-space:pre-wrap;line-height:1.55}
.dots{display:flex;gap:3px}.dot{width:5px;height:5px;border-radius:50%;background:var(--tx3);animation:dotB .8s ease infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.input-bar{display:flex;gap:7px;padding:8px 16px 16px;border-top:1px solid var(--bd2);background:var(--bg)}
.chat-input{flex:1;padding:10px 14px;border:1px solid var(--bd);border-radius:20px;font-size:12.5px;background:var(--sf)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.send-btn:disabled{opacity:.3}

/* Views */
.view-wrap{flex:1;overflow-y:auto;padding:12px 16px 70px}
.view-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.view-title{font-family:var(--sr);font-size:18px;font-weight:700}
.view-sub{font-size:11px;color:var(--tx3);margin-top:2px}
.add-btn{display:flex;align-items:center;gap:3px;padding:7px 12px;border-radius:7px;background:var(--tx);color:var(--bg);font-size:11px;font-weight:600}
.scope-tabs{display:flex;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.scope-tab{padding:4px 11px;border:1px solid var(--bd);border-radius:14px;font-size:11px;color:var(--tx3);font-weight:500}
.scope-tab.active{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.quad-label{display:flex;align-items:center;gap:4px;font-size:12px;margin:3px 0 5px}

/* Task Card */
.task-card{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;background:var(--sf);border-radius:8px;margin-bottom:4px;border-left:3px solid #ccc;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .15s}
.task-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.06)}.task-card.completed{opacity:.4}.task-card.due-soon{animation:glow 2s infinite}
.checkbox{width:17px;height:17px;min-width:17px;border-radius:4px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px}
.del-btn{color:var(--bd);font-size:15px;padding:0 2px;line-height:1}.del-btn:hover{color:var(--red)}
.avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--f);flex-shrink:0}

/* Matrix */
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.matrix-cell{border:1px solid var(--bd);border-radius:9px;padding:10px;min-height:90px}
.matrix-item{display:flex;align-items:center;gap:4px;padding:5px 7px;background:var(--sf);border-radius:5px;margin-bottom:2px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03);font-size:10px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-header{font-size:10px;font-weight:700;color:var(--tx3);text-align:center;padding:4px}
.cal-day{min-height:60px;padding:4px;border:1px solid var(--bd2);border-radius:6px;font-size:10px;background:var(--sf);cursor:pointer;transition:all .15s}
.cal-day:hover{background:var(--sf2)}.cal-day.today{border-color:var(--blue);background:rgba(46,134,193,.04)}
.cal-day.other{opacity:.3}.cal-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin:1px}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:var(--sf);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-family:var(--sr);font-size:28px;font-weight:700}
.stat-label{font-size:10px;color:var(--tx3);margin-top:2px}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:10px;padding:0 4px}
.bar{flex:1;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.bar-label{font-size:8px;color:var(--tx3);text-align:center;margin-top:3px}
.member-stat{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sf);border-radius:8px;margin-bottom:4px}
.progress-bar{height:6px;background:var(--bd);border-radius:3px;flex:1;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* Modals */
.backdrop{position:fixed;inset:0;background:rgba(58,52,45,.35);z-index:90;backdrop-filter:blur(2px)}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;background:var(--sf);border-radius:16px 16px 0 0;padding:20px 18px 26px;z-index:100;box-shadow:0 -6px 28px rgba(0,0,0,.13);max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
.form-input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;font-size:12.5px;margin-bottom:10px;background:var(--bg)}
textarea.form-input{min-height:44px;resize:vertical}
.form-label{display:block;font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.quad-opt{display:flex;align-items:center;gap:5px;padding:8px 9px;border:1.5px solid var(--bd);border-radius:7px;font-size:10px;font-weight:600;color:var(--tx2)}
.cat-row,.assign-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cat-opt,.scope-opt{padding:4px 10px;border:1.5px solid var(--bd);border-radius:6px;font-size:10.5px;font-weight:500}
.cat-opt.sel,.scope-opt.sel{border-color:var(--blue);background:rgba(46,134,193,.06)}
.scope-row{display:flex;gap:6px;margin-bottom:12px}.scope-opt{flex:1;text-align:center;font-size:11px}
.assign-opt{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 3px;border:1.5px solid var(--bd);border-radius:18px;font-size:11px}
.assign-opt.sel{background:rgba(46,134,193,.06)}
.date-row{display:flex;gap:8px;margin-bottom:10px}.date-row input,.date-row select{flex:1}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
.toggle{width:38px;height:20px;border-radius:10px;position:relative;transition:background .2s}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.form-actions{display:flex;gap:8px}
.cancel-btn{flex:1;padding:10px;border:1px solid var(--bd);border-radius:7px;color:var(--tx3);font-size:12.5px;font-weight:600}
.submit-btn{flex:2;padding:10px;border-radius:7px;background:var(--tx);color:var(--bg);font-size:12.5px;font-weight:600}.submit-btn:disabled{opacity:.35}

/* Detail */
.assignee-chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;background:var(--sf2);border-radius:20px;font-size:11px;font-weight:500}
.detail-actions{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.detail-action{padding:6px 12px;border:1px solid var(--bd);border-radius:7px;font-size:11px;color:var(--tx2)}.detail-action:hover{background:var(--sf2)}.detail-action.danger{color:var(--red)}
.comment-card{padding:8px 10px;background:var(--sf3);border-radius:7px;margin-bottom:5px}
.member-row{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--sf3);border-radius:8px;margin-bottom:6px}

/* Subtasks */
.subtask-row{display:flex;align-items:center;gap:6px;padding:4px 0}
.subtask-cb{width:14px;height:14px;min-width:14px;border-radius:3px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer}
.subtask-cb.done{background:var(--green);border-color:var(--green);color:#fff}
.subtask-text{font-size:12px;flex:1}.subtask-text.done{text-decoration:line-through;color:var(--tx3)}
.subtask-del{font-size:12px;color:var(--tx3);padding:0 4px;cursor:pointer}.subtask-del:hover{color:var(--red)}

/* Time tracker */
.timer-display{font-family:'Courier New',monospace;font-size:20px;font-weight:700;text-align:center;padding:8px;background:var(--bg);border-radius:8px;margin:8px 0}
.timer-btn{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--bd)}
.timer-btn.active{background:var(--red);color:#fff;border-color:var(--red)}

.empty-state{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center}
.export-btn{padding:6px 12px;border:1px solid var(--bd);border-radius:7px;font-size:11px;color:var(--tx2);margin-left:6px}
.export-btn:hover{background:var(--sf2)}
@media(max-width:500px){.matrix-grid{gap:5px}.matrix-cell{padding:8px;min-height:70px}.nav-btn{padding:3px 6px;font-size:8px}.stat-grid{grid-template-columns:1fr 1fr}.cal-day{min-height:44px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCrXugHg_SNSkfVmmyhYtFJ0oiZLdZiucc",authDomain:"tasks---pa.firebaseapp.com",databaseURL:"https://tasks---pa-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tasks---pa",storageBucket:"tasks---pa.firebasestorage.app",messagingSenderId:"982342404744",appId:"1:982342404744:web:ce7a55cc852cf80279ad3d"});
const db=firebase.database(),auth=firebase.auth();

const QDS=[
  {id:"do",label:"Do First",sub:"Urgent & Important",color:"#C0392B",bg:"rgba(192,57,43,.06)",icon:"🔥"},
  {id:"schedule",label:"Schedule",sub:"Important, Not Urgent",color:"#2E86C1",bg:"rgba(46,134,193,.06)",icon:"📅"},
  {id:"delegate",label:"Delegate",sub:"Urgent, Not Important",color:"#D4850E",bg:"rgba(212,133,14,.06)",icon:"👋"},
  {id:"eliminate",label:"Later",sub:"Neither",color:"#8E8E8E",bg:"rgba(142,142,142,.06)",icon:"📦"},
];
const CATS=[{id:"project",label:"Project",e:"📊"},{id:"meeting",label:"Meeting",e:"🤝"},{id:"deadline",label:"Deadline",e:"⏰"},{id:"review",label:"Review",e:"🔍"},{id:"planning",label:"Planning",e:"🗓"},{id:"admin",label:"Admin",e:"📎"},{id:"personal",label:"Personal",e:"🏠"}];
const ACOL=["#C0392B","#2E86C1","#27AE60","#8E44AD","#D4850E","#16A085","#E74C3C","#2980B9","#1ABC9C","#E67E22"];
const RECUR_OPTS=[{id:"none",label:"None"},{id:"daily",label:"Daily"},{id:"weekly",label:"Weekly"},{id:"monthly",label:"Monthly"}];

let user=null,activeTimer=null,timerInterval=null;
let S={phase:"login",syncStatus:"connecting",tasks:[],members:[],messages:[],view:"chat",taskScope:"all",sending:false,selectedTask:null,showTaskForm:false,editTask:null,showTeam:false,showSettings:false,darkMode:false,calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),
fT:"",fD:"",fCat:"project",fQ:"do",fDt:"",fTm:"",fRem:false,fSc:"shared",fAs:[],fRecur:"none",fSubtasks:[],newSubtask:"",
newName:"",newRole:"",commentInput:"",input:"",loginError:"",timerSeconds:0};

// Utils
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().split("T")[0];
const nowT=()=>{const d=new Date();return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function fmtDT(d,t){if(!d)return"";const x=new Date(d+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);const df=Math.round((x-n)/864e5);let s=df===0?"Today":df===1?"Tomorrow":df===-1?"Yesterday":df<-1?`${Math.abs(df)}d overdue`:df<=7?`In ${df}d`:x.toLocaleDateString("en-US",{month:"short",day:"numeric"});if(t){const[h,m]=t.split(":").map(Number);s+=` at ${h%12||12}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`}return s}
const isOD=(d,t)=>d?new Date(d+"T"+(t||"23:59")+":00")<new Date():false;
const isDueSoon=(d,t)=>{if(!d)return false;const df=new Date(d+"T"+(t||"23:59")+":00")-new Date();return df>0&&df<3600000};
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"};
const ini=n=>(n||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
const acol=n=>{let h=0;for(let i=0;i<(n||"").length;i++)h=n.charCodeAt(i)+((h<<5)-h);return ACOL[Math.abs(h)%ACOL.length]};
const timeAgo=iso=>{const s=Math.floor((Date.now()-new Date(iso))/1000);return s<60?"just now":s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:`${Math.floor(s/86400)}d ago`};
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const av=(name,sz=24)=>`<div class="avatar" style="width:${sz}px;height:${sz}px;min-width:${sz}px;font-size:${sz*.38}px;background:${acol(name)}">${ini(name)}</div>`;
const pav=(url,sz=24)=>url?`<img src="${url}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover">`:"";
function fmtTimer(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`}

// Theme
function toggleTheme(){S.darkMode=!S.darkMode;document.documentElement.setAttribute("data-theme",S.darkMode?"dark":"");localStorage.setItem("wa-theme",S.darkMode?"dark":"light");render()}
(function initTheme(){const t=localStorage.getItem("wa-theme");if(t==="dark"){S.darkMode=true;document.documentElement.setAttribute("data-theme","dark")}})();

// Auth
auth.onAuthStateChanged(u=>{
  if(u){user=u;S.loginError="";
    const ref=db.ref("members/"+u.uid);
    ref.once("value").then(s=>{if(!s.val())ref.set({id:u.uid,name:u.displayName||u.email.split("@")[0],email:u.email||"",photo:u.photoURL||"",role:"Team Member"});else ref.update({name:u.displayName||s.val().name,email:u.email||"",photo:u.photoURL||""})});
    db.ref("presence/"+u.uid).onDisconnect().remove();
    db.ref("presence/"+u.uid).set({name:u.displayName,t:firebase.database.ServerValue.TIMESTAMP});

// Recurring tasks
function checkRecurring(){
  const now=new Date();const td=today();
  S.tasks.forEach(t=>{
    if(!t.recurring||t.recurring==="none"||!t.completed||!t.dueDate)return;
    const last=t.lastRecurred||t.dueDate;if(last>=td)return;
    let nextDate=new Date(t.dueDate+"T00:00:00");
    while(nextDate.toISOString().split("T")[0]<=td){
      if(t.recurring==="daily")nextDate.setDate(nextDate.getDate()+1);
      else if(t.recurring==="weekly")nextDate.setDate(nextDate.getDate()+7);
      else if(t.recurring==="monthly")nextDate.setMonth(nextDate.getMonth()+1);
    }
    const nd=nextDate.toISOString().split("T")[0];
    const nt={...t,id:uid(),completed:false,dueDate:nd,createdAt:new Date().toISOString(),createdBy:t.createdBy||user?.uid,comments:[],subtasks:(t.subtasks||[]).map(s=>({...s,done:false})),timeSpent:0};
    fbS(nt);fbS({...t,lastRecurred:td});
  });
}

// Send push notification via ntfy.sh
function sanitizeHeader(str){return(str||"").replace(/[^\x20-\x7E]/g,"")}
async function sendNtfy(topic,title,body,priority="default",tags=""){
  try{
    await fetch("https://ntfy.sh/"+topic,{

// Check tasks and send reminders to assigned members
function checkAndNotify(){
  if(!user||!S.tasks.length)return;
  const now=new Date();
  S.tasks.forEach(t=>{
    if(t.completed||!t.dueDate||!t.dueTime||!t.reminder)return;
    const due=new Date(t.dueDate+"T"+t.dueTime+":00");
    const diff=due-now;

    // 30 min before — send to all assignees
    if(diff>0&&diff<=1800000&&!ntfySent.has(t.id+"_soon")){
      ntfySent.add(t.id+"_soon");
      const mins=Math.round(diff/60000);
      (t.assignees||[]).forEach(aid=>{
        const m=S.members.find(x=>x.id===aid);
        if(!m?.email)return;
        const topic=getNtfyTopic(m.email);
        if(topic)sendNtfy(topic,
          "Task Due in "+mins+" min",
          t.title+" - due at "+t.dueTime,
          "high","alarm_clock");
      });
    }

    // Overdue — send to all assignees
    if(diff<0&&diff>-120000&&!ntfySent.has(t.id+"_overdue")){
      ntfySent.add(t.id+"_overdue");
      (t.assignees||[]).forEach(aid=>{
        const m=S.members.find(x=>x.id===aid);
        if(!m?.email)return;
        const topic=getNtfyTopic(m.email);
        if(topic)sendNtfy(topic,
          "Task Overdue!",
          t.title+" - was due at "+t.dueTime,
          "urgent","warning");
      });
    }

    // Follow-up: 1 hour overdue
    if(diff<-3600000&&diff>-3660000&&!ntfySent.has(t.id+"_followup")){
      ntfySent.add(t.id+"_followup");
      (t.assignees||[]).forEach(aid=>{
        const m=S.members.find(x=>x.id===aid);
        if(!m?.email)return;
        const topic=getNtfyTopic(m.email);
        if(topic)sendNtfy(topic,
          "Follow-up: Still pending",
          t.title+" - has been overdue for 1 hour",
          "high","bell");
      });
    }
  });

  // Daily morning summary at ~8-9am (runs once)
  const h=now.getHours();
  if(h>=8&&h<9&&!ntfySent.has("daily_"+today())){
    ntfySent.add("daily_"+today());
    const myTasks=S.tasks.filter(t=>!t.completed&&t.assignees?.includes(user.uid)&&t.dueDate===today());
    if(myTasks.length){
      const topic=getMyTopic();
      if(topic)sendNtfy(topic,
        "You have "+myTasks.length+" task"+(myTasks.length>1?"s":"")+" due today",
        myTasks.map(t=>t.title+(t.dueTime?" at "+t.dueTime:"")).join("\n"),
        "default","clipboard");
    }
  }
}
// Check every 30 seconds

// ═══ SMART PARSER ═══
function parseNaturalLang(input){
  const txt=input.toLowerCase().trim();
  // Check if it's a question/conversation (send to AI)
  const questionWords=["what","how","why","when","which","who","should","can","could","would","give me","tell me","help me","show me","summarize","analyse","analyze","overview","check","review my","status","focus","priority","priorities","advice","suggest","recommend"];
  if(questionWords.some(q=>txt.startsWith(q))||txt.endsWith("?")||txt.includes("what should")||txt.includes("how many")||txt.includes("daily check"))return null;

  let title="",assignees=[],dueDate="",dueTime="",quadrant="do",category="project",recurring="none",reminder=true,scope="shared",subtasks=[];
  const now=new Date();

  // Extract "assign to X" / "for X" / "to X"
  const assignMatch=input.match(/(?:assign(?:ed)?(?:\s+(?:it|this|task))?\s+to|for)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
  if(assignMatch){
    const name=assignMatch[1].trim();
    const member=S.members.find(m=>m.name.toLowerCase().includes(name.toLowerCase()));
    if(member)assignees.push(member.id);
  }

  // Extract recurring
  if(/\bevery\s+day\b|\bdaily\b/i.test(txt))recurring="daily";
  else if(/\bevery\s+week\b|\bweekly\b|\bevery\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(txt))recurring="weekly";
  else if(/\bevery\s+month\b|\bmonthly\b/i.test(txt))recurring="monthly";

  // Extract time
  const timeMatch=input.match(/(?:at|by|before)\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm|AM|PM)?/i);
  if(timeMatch){
    let h=parseInt(timeMatch[1]),m=parseInt(timeMatch[2]||"0");
    const ap=(timeMatch[3]||"").toLowerCase();
    if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;
    dueTime=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  }
  if(/\bEOD\b|\bend of day\b/i.test(txt))dueTime="17:00";
  if(/\bmorning\b/i.test(txt)&&!dueTime)dueTime="09:00";
  if(/\bnoon\b|\bmidday\b/i.test(txt)&&!dueTime)dueTime="12:00";
  if(/\bafternoon\b/i.test(txt)&&!dueTime)dueTime="14:00";

  // Extract relative time "in X minutes/hours"
  const relMatch=input.match(/in\s+(\d+)\s+(minute|min|hour|hr)s?\b/i);
  if(relMatch){
    const val=parseInt(relMatch[1]),unit=relMatch[2].toLowerCase();
    const future=new Date(now.getTime()+(unit.startsWith("h")?val*3600000:val*60000));
    dueDate=future.toISOString().split("T")[0];
    dueTime=`${String(future.getHours()).padStart(2,"0")}:${String(future.getMinutes()).padStart(2,"0")}`;
  }

  // Extract date
  const dayNames=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const dayMatch=txt.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
  if(dayMatch&&!dueDate){
    const target=dayNames.indexOf(dayMatch[1].toLowerCase());
    const d=new Date(now);d.setHours(0,0,0,0);
    let diff=target-d.getDay();if(diff<=0)diff+=7;
    d.setDate(d.getDate()+diff);dueDate=d.toISOString().split("T")[0];
  }
  if(/\btoday\b/i.test(txt)&&!dueDate)dueDate=today();
  if(/\btomorrow\b/i.test(txt)&&!dueDate){const d=new Date(now);d.setDate(d.getDate()+1);dueDate=d.toISOString().split("T")[0]}
  if(/\bnext week\b/i.test(txt)&&!dueDate){const d=new Date(now);d.setDate(d.getDate()+7);dueDate=d.toISOString().split("T")[0]}
  // Explicit date
  const dateMatch=input.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if(dateMatch&&!dueDate){const y=dateMatch[3]?dateMatch[3].length===2?"20"+dateMatch[3]:dateMatch[3]:String(now.getFullYear());dueDate=`${y}-${String(dateMatch[1]).padStart(2,"0")}-${String(dateMatch[2]).padStart(2,"0")}`}

  // Extract priority
  if(/\burgent\b|\basap\b|\bcritical\b|\bemergency\b|\bimmediate\b/i.test(txt))quadrant="do";
  else if(/\bimportant\b|\bschedule\b|\bplan\b/i.test(txt))quadrant="schedule";
  else if(/\bdelegate\b/i.test(txt))quadrant="delegate";
  else if(/\blow priority\b|\blater\b|\bsomeday\b|\bwhenever\b/i.test(txt))quadrant="eliminate";
  else if(dueDate){const d=new Date(dueDate+"T"+(dueTime||"23:59")+":00");const diff=d-now;quadrant=diff<86400000?"do":diff<259200000?"schedule":"schedule"}

  // Extract category
  if(/\bmeeting\b|\bcall\b|\bsync\b|\bstandup\b/i.test(txt))category="meeting";
  else if(/\bdeadline\b|\bsubmit\b|\bdue\b/i.test(txt))category="deadline";
  else if(/\breview\b|\bcheck\b|\bfeedback\b|\bapprove\b/i.test(txt))category="review";
  else if(/\bplan\b|\bstrategy\b|\broadmap\b/i.test(txt))category="planning";
  else if(/\badmin\b|\bpaper\b|\bfile\b|\bform\b/i.test(txt))category="admin";
  else if(/\bpersonal\b|\bgym\b|\bdoctor\b|\bhome\b/i.test(txt)){category="personal";scope="personal"}

  // Extract subtasks "with subtasks: a, b, c"
  const subMatch=input.match(/(?:with\s+)?subtasks?[:\s]+(.+)/i);
  if(subMatch)subtasks=subMatch[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);

  // Extract scope
  if(/\bpersonal\b|\bprivate\b|\bjust me\b|\bonly me\b/i.test(txt))scope="personal";

  // Clean title: remove parsed parts
  title=input
    .replace(/(?:assign(?:ed)?(?:\s+(?:it|this|task))?\s+to|for)\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?/i,"")
    .replace(/(?:at|by|before)\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?/i,"")
    .replace(/\b(?:today|tomorrow|next week|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i,"")
    .replace(/\b(?:EOD|end of day|morning|noon|afternoon)\b/i,"")
    .replace(/\bin\s+\d+\s+(?:minute|min|hour|hr)s?\b/i,"")
    .replace(/\b(?:urgent|asap|critical|important|low priority|later)\b/i,"")
    .replace(/\b(?:every\s+(?:day|week|month|monday|tuesday|wednesday|thursday|friday|saturday|sunday)|daily|weekly|monthly)\b/i,"")
    .replace(/(?:with\s+)?subtasks?[:\s]+.+/i,"")
    .replace(/\b(?:personal|private|shared)\b/i,"")
    .replace(/\b(?:remind me to|remind me|please|can you|add task)\b/i,"")
    .replace(/\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?/,"")
    .replace(/\s{2,}/g," ").trim();

  if(!title||title.length<2)return null;
  // Capitalize first letter
  title=title.charAt(0).toUpperCase()+title.slice(1);

  return{title,assignees,dueDate,dueTime,quadrant,category,recurring,reminder,scope,subtasks};
}

    h+=`<div style="display:flex;gap:6px;margin-top:6px"><input class="form-input" id="new-sub" placeholder="Add subtask…" value="${esc(S.newSubtask)}" style="flex:1;margin-bottom:0"><button class="send-btn" id="add-sub" style="width:30px;height:30px;font-size:12px" ${!S.newSubtask.trim()?"disabled":""}>+</button></div></div>`;
    h+=`<div class="detail-actions"><button class="detail-action" data-edit="${t.id}">✏️ Edit</button><button class="detail-action" data-togdet="${t.id}">${t.completed?"↩ Reopen":"✓ Complete"}</button><button class="detail-action danger" data-deldet="${t.id}">🗑 Delete</button></div>`;
    if(t.scope==="shared"){h+=`<div><span class="form-label">Comments ${(t.comments||[]).length?`(${t.comments.length})`:""}</span><div style="max-height:150px;overflow-y:auto;margin-bottom:8px">${!(t.comments||[]).length?'<p style="font-size:11px;color:var(--tx3)">No comments yet</p>':""}${(t.comments||[]).map(c=>{const m=S.members.find(x=>x.id===c.authorId);return`<div class="comment-card"><div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">${m?.photo?pav(m.photo,18):av(c.author,18)}<span style="font-size:11px;font-weight:600">${esc(c.author)}</span><span style="font-size:9px;color:var(--tx3)">${timeAgo(c.createdAt)}</span></div><p style="font-size:12px;line-height:1.45">${esc(c.text)}</p></div>`}).join("")}</div><div style="display:flex;gap:6px"><input class="form-input" id="cmt-i" placeholder="Add a comment…" value="${esc(S.commentInput)}" style="flex:1;margin-bottom:0"><button class="send-btn" id="cmt-s" style="width:34px;height:34px;font-size:14px" ${!S.commentInput.trim()?"disabled":""}>↑</button></div></div>`}
    h+=`</div>`}

  // TEAM
  if(S.showTeam){
    h+=`<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-family:var(--sr);font-size:18px;font-weight:700">👥 Team</h2><button style="font-size:18px;color:var(--tx3)" id="close-team">×</button></div>
    ${S.members.map(m=>`<div class="member-row">${m.photo?pav(m.photo,30):av(m.name,30)}<div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(m.name)} ${m.id===user?.uid?'<span style="font-size:10px;color:var(--blue)">(You)</span>':""}</div><div style="font-size:11px;color:var(--tx3)">${esc(m.email||m.role)} · ${S.tasks.filter(t=>t.assignees?.includes(m.id)&&!t.completed).length} active</div></div>${m.id!==user?.uid&&!m.email?`<button style="color:var(--tx3);font-size:15px" data-rmm="${m.id}">×</button>`:""}</div>`).join("")}
    <div style="margin-top:14px"><span class="form-label">Add External Member</span><div style="display:flex;gap:6px"><input class="form-input" id="nn" placeholder="Name *" value="${esc(S.newName)}" style="flex:2;margin-bottom:0"><input class="form-input" id="nr" placeholder="Role" value="${esc(S.newRole)}" style="flex:1;margin-bottom:0"></div>
    <button class="add-btn" id="add-m" style="margin-top:8px;width:100%;justify-content:center" ${!S.newName.trim()?"disabled":""}>+ Add</button></div>
    <p style="font-size:11px;color:var(--tx3);margin-top:12px">💡 Team members are added automatically when they sign in.</p></div>`;
  }

  // FORM
  if(S.showTaskForm){
    h+=`<div class="modal"><h2 style="font-family:var(--sr);font-size:17px;font-weight:700;margin-bottom:14px">${S.editTask?"Edit Task":"New Task"}</h2>
    <input class="form-input" id="ft" placeholder="What needs to be done? *" value="${esc(S.fT)}">
    <textarea class="form-input" id="fd" placeholder="Notes (optional)">${esc(S.fD)}</textarea>
    <span class="form-label">Priority</span><div class="quad-grid">${QDS.map(q=>`<button class="quad-opt" data-fq="${q.id}" style="${S.fQ===q.id?`border-color:${q.color};background:${q.bg}`:""}"><span>${q.icon}</span><span style="color:${S.fQ===q.id?q.color:"var(--tx2)"}">${q.label}</span></button>`).join("")}</div>
    <span class="form-label">Category</span><div class="cat-row">${CATS.map(c=>`<button class="cat-opt ${S.fCat===c.id?"sel":""}" data-fc="${c.id}">${c.e} ${c.label}</button>`).join("")}</div>
    <span class="form-label">Scope</span><div class="scope-row"><button class="scope-opt ${S.fSc==="shared"?"sel":""}" data-fs="shared">👥 Shared</button><button class="scope-opt ${S.fSc==="personal"?"sel":""}" data-fs="personal">🔒 Personal</button></div>
    ${S.fSc==="shared"&&S.members.length?`<span class="form-label">Assign to</span><div class="assign-row">${S.members.map(m=>`<button class="assign-opt ${S.fAs.includes(m.id)?"sel":""}" data-fa="${m.id}" style="${S.fAs.includes(m.id)?`border-color:${acol(m.name)}`:""}">${m.photo?pav(m.photo,16):av(m.name,16)}<span>${esc(m.name)}</span></button>`).join("")}</div>`:""}
    <span class="form-label">Due Date & Time</span><div class="date-row"><input type="date" class="form-input" id="fdt" value="${S.fDt}" style="margin-bottom:0"><input type="time" class="form-input" id="ftm" value="${S.fTm}" style="margin-bottom:0"></div>
    <span class="form-label">Recurring</span><div class="cat-row">${RECUR_OPTS.map(r=>`<button class="cat-opt ${S.fRecur===r.id?"sel":""}" data-fr="${r.id}">${r.id==="daily"?"🔄 ":""}${r.id==="weekly"?"🔄 ":""}${r.id==="monthly"?"🔄 ":""}${r.label}</button>`).join("")}</div>
    <div class="toggle-row" id="tog-r"><div class="toggle" style="background:${S.fRem?"var(--blue)":"var(--bd)"}"><div class="toggle-knob" style="transform:translateX(${S.fRem?18:2}px)"></div></div><span style="font-size:12px;color:var(--tx2)">🔔 Remind me</span></div>
    ${!S.editTask?`<span class="form-label">Subtasks</span><div style="margin-bottom:12px">${S.fSubtasks.map((s,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:12px;flex:1">${esc(s)}</span><button style="font-size:12px;color:var(--tx3)" data-rmfsub="${i}">×</button></div>`).join("")}<div style="display:flex;gap:6px"><input class="form-input" id="fsub-input" placeholder="Add subtask…" style="flex:1;margin-bottom:0"><button class="add-btn" id="fsub-add" style="padding:6px 10px;font-size:10px">+</button></div></div>`:""}
    <div class="form-actions"><button class="cancel-btn" id="can-f">Cancel</button><button class="submit-btn" id="sub-f" ${!S.fT.trim()?"disabled":""}>${S.editTask?"Save":"Add Task"}</button></div></div>`;
  }

  app.innerHTML=h;bindEv();
}

function rTC(t){const q=QDS.find(x=>x.id===t.quadrant),cat=CATS.find(c=>c.id===t.category),od=isOD(t.dueDate,t.dueTime)&&!t.completed,soon=isDueSoon(t.dueDate,t.dueTime)&&!t.completed;
  const subs=t.subtasks||[],subDone=subs.filter(s=>s.done).length;
  return`<div class="task-card ${t.completed?"completed":""} ${soon?"due-soon":""}" style="border-left-color:${q?.color||"#ccc"}"><button class="checkbox" data-tog="${t.id}" style="background:${t.completed?q?.color:"transparent"};border-color:${t.completed?q?.color:"var(--bd)"};color:var(--bg)">${t.completed?"✓":""}</button><div style="flex:1;cursor:pointer;min-width:0" data-sel="${t.id}"><div style="display:flex;justify-content:space-between;align-items:center;gap:5px"><span style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${t.completed?"text-decoration:line-through":""}">${esc(t.title)}</span><div style="display:flex;gap:3px;align-items:center;flex-shrink:0;font-size:9px">${t.recurring&&t.recurring!=="none"?"<span>🔄</span>":""}${t.scope==="personal"?"<span>🔒</span>":"<span>👥</span>"}${t.reminder?"<span>🔔</span>":""}${(t.comments||[]).length?`<span>💬${t.comments.length}</span>`:""}${subs.length?`<span>☑${subDone}/${subs.length}</span>`:""}<span>${cat?.e||""}</span></div></div><div style="display:flex;align-items:center;gap:6px;margin-top:2px">${t.dueDate?`<span style="font-size:10.5px;color:${od?"var(--red)":soon?"var(--orange)":"var(--tx3)"};font-weight:${od||soon?600:400}">${od?"⚠ ":""}${fmtDT(t.dueDate,t.dueTime)}</span>`:""}<div style="display:flex;gap:1px;margin-left:auto">${(t.assignees||[]).slice(0,3).map(a=>{const m=S.members.find(x=>x.id===a);return m?m.photo?pav(m.photo,16):av(m.name,16):""}).join("")}</div></div></div><button class="del-btn" data-del="${t.id}">×</button></div>`}

function bindEv(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.selectedTask=null;render()});
  document.getElementById("nav-team")?.addEventListener("click",()=>{S.showTeam=true;render()});
  document.getElementById("signout")?.addEventListener("click",signOut);
  document.getElementById("theme-btn")?.addEventListener("click",toggleTheme);
  document.getElementById("enable-notif")?.addEventListener("click",()=>{Notification.requestPermission().then(()=>render())});
  document.getElementById("ntfy-done")?.addEventListener("click",()=>{localStorage.setItem("wa-ntfy-setup-"+user?.uid,"1");render()});
  document.getElementById("ntfy-dismiss")?.addEventListener("click",()=>{localStorage.setItem("wa-ntfy-setup-"+user?.uid,"1");render()});
  document.getElementById("bk")?.addEventListener("click",closeAll);
  document.getElementById("export-csv")?.addEventListener("click",exportCSV);
  document.getElementById("export-csv2")?.addEventListener("click",exportCSV);
  const ci=document.getElementById("ci");if(ci){ci.oninput=e=>{S.input=e.target.value;document.getElementById("sb").disabled=!e.target.value.trim()||S.sending};ci.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey)sendMsg()};ci.focus()}
  document.getElementById("sb")?.addEventListener("click",sendMsg);
  document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{S.input=b.dataset.prompt;render();setTimeout(()=>document.getElementById("ci")?.focus(),50)});
  document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{S.taskScope=b.dataset.scope;render()});
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=e=>{e.stopPropagation();togDone(b.dataset.tog)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();delTask(b.dataset.del)});
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{S.selectedTask=S.tasks.find(t=>t.id===b.dataset.sel);S.newSubtask="";render()});
  document.getElementById("add-t")?.addEventListener("click",()=>{rstForm();S.showTaskForm=true;render()});
  document.getElementById("close-det")?.addEventListener("click",()=>{if(activeTimer===S.selectedTask?.id)stopTimer();S.selectedTask=null;render()});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.edit);if(t)openEd(t)});
  document.querySelectorAll("[data-togdet]").forEach(b=>b.onclick=()=>togDone(b.dataset.togdet));
  document.querySelectorAll("[data-deldet]").forEach(b=>b.onclick=()=>delTask(b.dataset.deldet));
  document.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>startTimer(b.dataset.timer));
  document.querySelectorAll("[data-togsub]").forEach(b=>b.onclick=()=>{const[tid,sid]=b.dataset.togsub.split("|");togSubtask(tid,sid)});
  document.querySelectorAll("[data-delsub]").forEach(b=>b.onclick=()=>{const[tid,sid]=b.dataset.delsub.split("|");delSubtask(tid,sid)});
  const nsi=document.getElementById("new-sub");if(nsi){nsi.oninput=e=>{S.newSubtask=e.target.value;document.getElementById("add-sub").disabled=!e.target.value.trim()};nsi.onkeydown=e=>{if(e.key==="Enter")addSubtaskToTask()}}
  document.getElementById("add-sub")?.addEventListener("click",addSubtaskToTask);
  const cmi=document.getElementById("cmt-i");if(cmi){cmi.oninput=e=>{S.commentInput=e.target.value;document.getElementById("cmt-s").disabled=!e.target.value.trim()};cmi.onkeydown=e=>{if(e.key==="Enter")addCmt()}}
  document.getElementById("cmt-s")?.addEventListener("click",addCmt);
  document.getElementById("close-team")?.addEventListener("click",()=>{S.showTeam=false;render()});
  const nn=document.getElementById("nn");if(nn){nn.oninput=e=>{S.newName=e.target.value;document.getElementById("add-m").disabled=!e.target.value.trim()};nn.onkeydown=e=>{if(e.key==="Enter")addMem()}}
  document.getElementById("nr")?.addEventListener("input",e=>{S.newRole=e.target.value});
  document.getElementById("nr")?.addEventListener("keydown",e=>{if(e.key==="Enter")addMem()});
  document.getElementById("add-m")?.addEventListener("click",addMem);
  document.querySelectorAll("[data-rmm]").forEach(b=>b.onclick=()=>rmMem(b.dataset.rmm));
  document.getElementById("ft")?.addEventListener("input",e=>{S.fT=e.target.value;document.getElementById("sub-f").disabled=!e.target.value.trim()});
  document.getElementById("fd")?.addEventListener("input",e=>{S.fD=e.target.value});
  document.querySelectorAll("[data-fq]").forEach(b=>b.onclick=()=>{S.fQ=b.dataset.fq;render()});
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{S.fCat=b.dataset.fc;render()});
  document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{S.fSc=b.dataset.fs;render()});
  document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{const id=b.dataset.fa;S.fAs=S.fAs.includes(id)?S.fAs.filter(x=>x!==id):[...S.fAs,id];render()});
  document.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>{S.fRecur=b.dataset.fr;render()});
  document.getElementById("fdt")?.addEventListener("input",e=>{S.fDt=e.target.value});
  document.getElementById("ftm")?.addEventListener("input",e=>{S.fTm=e.target.value});
  document.getElementById("tog-r")?.addEventListener("click",()=>{S.fRem=!S.fRem;render()});
  const fsi=document.getElementById("fsub-input");if(fsi){fsi.onkeydown=e=>{if(e.key==="Enter"&&fsi.value.trim()){S.fSubtasks.push(fsi.value.trim());render()}}}
  document.getElementById("fsub-add")?.addEventListener("click",()=>{const v=document.getElementById("fsub-input")?.value;if(v?.trim()){S.fSubtasks.push(v.trim());render()}});
  document.querySelectorAll("[data-rmfsub]").forEach(b=>b.onclick=()=>{S.fSubtasks.splice(parseInt(b.dataset.rmfsub),1);render()});
  document.getElementById("can-f")?.addEventListener("click",()=>{rstForm();render()});
  document.getElementById("sub-f")?.addEventListener("click",subForm);
  // Calendar nav
  document.getElementById("cal-prev")?.addEventListener("click",()=>{S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--}render()});
  document.getElementById("cal-next")?.addEventListener("click",()=>{S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++}render()});
}
render();
setInterval(()=>{if(S.phase==="app"&&!activeTimer)render()},30000);
</script>
</body>
</html>
